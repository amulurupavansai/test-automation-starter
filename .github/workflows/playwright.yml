name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Optional tag/title filter, e.g. @smoke'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        # TEST_ENV defaults to "local": the bundled demo app is started automatically.
        # To target a real environment, set TEST_ENV and the matching *_BASE_URL / credentials
        # as repository variables and secrets (see README "Adapting to a real application").
        run: npx playwright test ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}
        env:
          CI: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-and-traces
          path: |
            reports/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
